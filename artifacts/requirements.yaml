    release: v0.1.0
    fields:
      priority: must
      category: interface
      review: author-verified only (tests in CI); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-012
    type: requirement
    title: Pass every case of the language-neutral classifier corpus in both directions
    status: verified
    description: >
      tools/ci/classifier-corpus/ (74 cases from gale, relay, rivet, loom):
      each expected-true class is selected and each expected-false class is
      not; expected run_all and expected errors match. Vendored into this
      repository and run in CI.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-001}
      - {type: constraint-satisfies, target: SC-006}

  - id: REQ-013
    type: requirement
    title: Gate every consumer switch-over and every release by an old-vs-new equivalence run
    status: verified
    description: >
      Run the previous and the new classifier in GATE_PROBE_FILES mode over
      each first-parent commit diff of the consumer's main (400 commits).
      Every difference is listed and must be an intended narrowing.
    release: v0.2.0
    fields:
      priority: must
      category: constraint
      review: author-verified only (tests/equivalence.rs; gale 400/400 identical against its Python reference); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-014
    type: requirement
    title: Provide the consumer workflow gates (a)-(c) as a sieve subcommand
    status: verified
    description: >
      Port of gale's tools/check-required-contexts.py (no new Python): (a) no
      workflow-level paths on workflows hosting a required context; (b) a
      required job's if: is absent or exactly the gated form wired to a real
      classifier output, with the hardening (no step-level output reads, no
      continue-on-error, no skip inherited through needs:, exact classifier
      run/env, no env override of EVENT_NAME/BASE_SHA/GATE_PROBE_FILES); (c)
      the real classifier returns all-true on push, merge_group, no base, a
      bad diff and an empty diff.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: implemented by a subagent; graded by the session author against the Python reference (gale 44/44 a+b verdicts, relay 29/29) and an independent planted paths-filter spot check; 56/56 rule mutants killed
    links:
      - {type: constraint-satisfies, target: SC-004}
      - {type: satisfies, target: SSC-003}

  - id: REQ-015
    type: requirement
    title: Keep the false-skip oracle independent of sieve
    status: accepted
    description: >
      sieve's own tests do not count as the false-skip control. plant hosts
      the controls, with an oracle built from rustc dep-info and hand-named
      inputs, not from `sieve graph`.
    release: v0.2.0
    fields:
      priority: must
      category: constraint
      review: "evidence is in plant, not here: pulseengine/plant#17 (merged 450d978, 2026-11-18) checks sieve v0.1.0 with six planted false-skip controls whose true inputs come from rustc dep-info, not from sieve graph; criterion belongs to plant; accepted for v0.2.0 on that evidence by the owner (option dialogue, 2026-11-19)"
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-016
    type: requirement
    title: Run self-hosted CI jobs only behind the fail-closed fork guard
    status: verified
    description: >
      runs-on selects self-hosted only when the event is not pull_request or
      the head repository is this repository; otherwise ubuntu-latest. No
      self-hosted job in a pull_request_target workflow.
    release: v0.1.0
    fields:
      priority: must
      category: constraint
      review: author-verified only (tests/workflows.rs, release-check.sh smoke); the published-release cosign check is release step 6
    links:
      - {type: satisfies, target: SSC-001}

  - id: REQ-017
    type: requirement
