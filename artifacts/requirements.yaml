    release: v0.2.0
    fields:
      priority: should
      category: functional
      review: author-verified only (tests/observe.rs); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-020
    type: requirement
    title: Explain every selection and every skip in the classify output
