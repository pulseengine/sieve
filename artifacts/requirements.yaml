    release: v0.3.0
    fields: {priority: could, category: functional}
    links:
      - {type: constraint-satisfies, target: SC-006}

  - id: REQ-023
    type: requirement
    title: Treat toolchain, solver and environment pins as inputs of proof classes
    status: verified
    description: >
      Proof jobs (Kani, Verus, Rocq, Lean) depend on inputs dep-info does
      not show. Built in as run-all: rust-toolchain*, Cargo.lock, varve.toml,
      varve-realms.toml, Bazel files, .github/** (tool versions and env vars
      pinned in workflows), flake.nix, flake.lock, lean-toolchain. Solver
      and tool pins in other files are per-repo [run_all] or class inputs.
      Each kind gets a planted control (corpus case here; plant control in
      the consumer).
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: author-verified only (tests in CI); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-003}

  - id: REQ-024
    type: requirement
    title: Ship one self-contained binary that starts no git or cargo process to classify
    status: draft
    release: v0.2.0
    description: >
      Owner direction (2026-11-18). classify and graph read the repository
      in-process through gix (merge-base, tree diff, index) instead of the
      git command line. cargo's own schema types (cargo-util-schemas) were
      evaluated on 2026-11-19 and not adopted: they would give typed parsing
      only, while target discovery, workspace inheritance and the source
      scans (where selection behaviour lives) stay sieve's own and
      corpus-tested, and a manifest sieve cannot read already selects
      everything. The cargo-metadata cross-check stays an
      optional check-graph control that reports refused when cargo is
      absent: the cargo crate itself pulls libgit2, curl and openssl and
      would break the single binary and the WASI component.
    fields: {priority: must, category: constraint}
    links:
      - {type: satisfies, target: SSC-002}

  - id: REQ-025
    type: requirement
    title: Parse configuration and workflow YAML with rivet-yaml
    status: draft
    release: v0.3.0
    description: >
      Owner direction (2026-11-18). check-workflows and any YAML config use
      rivet-yaml (rivet's lossless rowan YAML crate; YAML 1.2 core, so `on:`
      is a string key; duplicate keys are errors), replacing yaml-rust2.
      Dependency: git, tag v0.43.0 once rivet cuts it, else v0.42.2. It
      stays a git dependency (owner: no crates.io publish of the rowan fork
      or rivet-yaml until upstream rowan is sound). Whether sieve.toml
      becomes sieve.yaml is a config-format change that goes through the
      seam block on #3 and its consumers first.
    fields: {priority: should, category: constraint}
    links:
      - {type: satisfies, target: SSC-002}

  - id: REQ-026
    type: requirement
    title: Flag a job that builds another class's binary without claiming its inputs
    status: draft
    release: v0.3.0
    description: >
      Found by spar's switch-over (2026-11-19): spar's Lean job runs
      `cargo build -p spar` and checks the Lean that spar generates, so a
      Rust-only change to spar's code generation can break it. Its class
      must therefore claim the spar package's Cargo closure; the old
      detector's equivalence could not show this, because it ran Lean on
      every code change. check-workflows (or a check-graph control) scans
      each gated job's run steps for `cargo build|run|test -p X` (and
      `--package X`, `--manifest-path`) and requires the job's classes to
      claim X's manifest; a miss is a gate failure.
    fields: {priority: should, category: functional}
    links:
      - {type: constraint-satisfies, target: SC-001}

  - id: REQ-027
    type: requirement
    title: A nested workspace's own Cargo.lock belongs to the classes that build that workspace
    status: draft
    release: v0.3.0
    description: >
      Measured on gale main e85b762 (the 25 commits since gale#491): 3 of
      them ran everything only because a nested workspace's lockfile changed
      (os/gust/Cargo.lock, drivers/sen66-thin/Cargo.lock). A Cargo.lock that
      sits beside a manifest declaring its own [workspace] affects only that
      workspace's builds, so it is claimed by every class whose Cargo walk
      reaches that root, and it stays run-all when no class does. The
      repository-root Cargo.lock stays a built-in run-all path. gale agrees
      (2026-11-19). An equivalence run against the consumer's old detector
      gates the change.
    fields: {priority: should, category: functional}
    links:
      - {type: constraint-satisfies, target: SC-006}

