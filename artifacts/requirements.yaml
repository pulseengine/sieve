      or rivet-yaml until upstream rowan is sound). Whether sieve.toml
      becomes sieve.yaml is a config-format change that goes through the
      seam block on #3 and its consumers first.
      2026-11-20: check-workflows parses with rivet-yaml at rivet v0.43.0
      (rev 5072986f); yaml-rust2 is removed. sieve.toml is unchanged.
    fields:
      priority: should
      category: constraint
      review: 'author-verified: full suite green; old (yaml-rust2, main 2b45f1a) vs new check-workflows identical on 15/15 repos (492 failures over 632 checks); no independent review'
    links:
      - {type: satisfies, target: SSC-002}

  - id: REQ-026
    type: requirement
    title: Flag a job that builds another class's binary without claiming its inputs
    status: verified
    release: v0.3.0
    description: >
      Found by spar's switch-over (2026-11-19): spar's Lean job runs
      `cargo build -p spar` and checks the Lean that spar generates, so a
      Rust-only change to spar's code generation can break it. Its class
      must therefore claim the spar package's Cargo closure; the old
      detector's equivalence could not show this, because it ran Lean on
      every code change. check-workflows (or a check-graph control) scans
      each gated job's run steps for `cargo build|run|test -p X` (and
      `--package X`, `--manifest-path`) and requires the job's classes to
      claim X's manifest; a miss is a gate failure.
      Implemented as check-workflows gate (d): cargo build, run, test,
      check, clippy, nextest, llvm-cov, kani, miri, bench and doc, with
      -p/--package (an @version or :version suffix stripped) or
      --manifest-path resolved against the step's working directory. The
      job's classes must claim the package's full closure as sieve derives
      it for a Cargo root (all targets, dev-dependencies, path deps, literal
      reads), not just the manifest.
      Fail closed: an unknown package, a path leaving the repository, or an
      expression. Not covered: a binary path built by another class, and
      a whole-workspace build without -p.
    fields:
      priority: should
      category: functional
      review: author-verified only (tests/cross_class.rs, spar pre-fix shape; 3 rule mutants killed); not run on a real adopter tree (no job_outputs map yet)
    links:
      - {type: constraint-satisfies, target: SC-001}

  - id: REQ-027
    type: requirement
    title: A nested workspace's own Cargo.lock belongs to the classes that build that workspace
    status: implemented
    release: v0.3.0
    description: "Measured on gale main e85b762 (the 25 commits since gale#491): 3 of them ran everything only because a nested workspace's lockfile changed (os/gust/Cargo.lock, drivers/sen66-thin/Cargo.lock). A Cargo.lock beside a manifest declaring its own [workspace] pins that workspace's builds. The root walk of every class whose package Cargo builds in that workspace claims it (source cargo-lock; the workspace is found as Cargo finds it, a root whose exclude covers the package, and no members entry does, is skipped; a crate reached only as a path dependency does not claim it). A change to it selects those classes plus every class with a claim inside the workspace directory. It still selects everything when: no root walk reaches it; a member manifest under it (by Cargo's rule or by nearest root) is claimed by no class; the member list reaches outside the directory; the adopter lists it, or the basename Cargo.lock, in [run_all]; or a tracked Bazel or Nix file may name it (the path, a label from any package above it, Cargo.lock together with the directory, .lock in a BUILD or Nix file at or above it, or a Nix relative path resolving to it): a crate_universe lockfile feeds Bazel targets sieve does not trace to it (DD-009; gale's tools/verus-strip/Cargo.lock is one). The repository-root Cargo.lock stays a built-in run-all path. gale agrees (2026-11-19). An equivalence run against the consumer's old detector gates adoption."
    fields: {priority: should, category: functional}
    links:
      - {type: constraint-satisfies, target: SC-006}

      - type: derives-from
        target: DD-009
  - id: REQ-028
    type: requirement
    title: Jobs a North Star guard requires to run can never be skipped
    status: verified
    release: v0.3.0
    description: >
      A `never_skip_jobs` list in sieve.toml names jobs whose skip would break
      an objective guard: hardware runs (O1: a skipped hardware run counts as a
      failure), the evidence verifier's negative control (O2), required proof
      checks and the trust-escape ledger (O3), and a gate's equivalence test
      (O5). check-workflows fails a listed job that can be skipped: an if:
      other than always() or !cancelled(), a need that has its own if:, a
      workflow trigger gate (a) rejects, or a name no workflow defines.
      Config key: [workflows] never_skip_jobs.
    fields:
      priority: must
      category: functional
      review: author-verified only (tests/never_skip.rs; 3 rule mutants killed); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-004}

  - id: REQ-029
    type: requirement
    title: sieve observe reports estimated saved runner-minutes and misses as m of N
    status: verified
    release: v0.3.0
    description: >
      From a consumer cost table, observe reports per class the skipped
      class-instances, the estimated saved runner-minutes (median cost times
      skipped classes; an estimate by construction, never called measured)
      and observed misses as "m of N", N being the skipped class-instances
      compared against a full run on main. One JSON document per varve layer.
      Implemented as `sieve observe --costs <sieve.costs.v1>` per run:
      compared_skipped_jobs (N), misses (m), uncompared and uncosted jobs
      listed, never counted, and skipped_jobs_run_before_merge from the
      table's merge_queue. Summing over the 30-PR window is the consumer's
      job (one observe document per run).
    fields:
      priority: should
      category: functional
      review: author-verified only (tests/observe.rs; 3 rule mutants killed); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-030
    type: requirement
    title: A change confined to one leaf workflow selects only that workflow's job classes
    status: implemented
    release: v0.3.0
    description: "Narrows the run-all rule for .github/ (amends REQ-005 and SSC-003; owner approved in the option dialog of 2026-11-20). Opt-in with [workflows] scope_leaf_edits = true, git mode only (the merge-base version is read through gix). A modification of one file directly under .github/workflows/ selects the classes read by the classifier if: of the changed and added jobs, every job that needs one of them (transitively) and every job those need. It still selects everything when: the file is added, deleted or reusable (on: workflow_call); anything outside jobs: changed; a job was removed; a job running sieve classify changed; a changed job changed if, needs, continue-on-error, strategy, uses or outputs, or a step's if/continue-on-error; a needs: entry is not exactly a job id; a step with continue-on-error changed; an affected job has a step if: reading a context other than github or runner, or a strategy computed from an expression; a job in the closure has an if: other than the exact classifier form or always()/!cancelled(); the file uses a YAML merge key; no job changed as parsed; or the adopter lists the file in [run_all]. Composite actions, reusable workflows, sieve.toml and anything else under .github/ select everything."
    fields: {priority: should, category: functional}
    links:
      - {type: constraint-satisfies, target: SC-006}
      - {type: derives-from, target: REQ-005}
      - {type: derives-from, target: SSC-003}

  - id: REQ-031
    type: requirement
    title: The classify and graph core runs as a signed WASI component identical to native
    status: draft
    release: v0.3.0
    description: >
      Built as a WASI component and run in sieve's CI under kiln and wasmtime
      on every paths-mode corpus case and on gale's last 400 commits, with
      JSON byte-identical to the native binary, the signature verified
      before it runs, no GAP switch, and a deliberately divergent build that
      must go red. Eligible to count under O5 once O5 has an indicator
      script.
    fields:
      priority: should
      category: constraint
      progress: >
        2026-11-20: the wasm32-wasip2 component builds unchanged. The Test job
        runs all 55 paths-mode corpus cases under wasmtime v50.0.3 (pinned),
        byte-identical to native. A divergent build fails 0/55 (checked
        locally). Open:
        (1) kiln at main b66776a2 runs all 55 cases byte-identical (2026-11-21,
        local, 1546 s vs 23 s under wasmtime) only when GITHUB_OUTPUT is
        created first: kiln cannot yet create a file through open flags
        (kiln SR-107, planned for kiln v0.9.0);
        (2) git mode fails open in the component, because gix 0.90 reads
        objects through mmap, which WASI lacks; the 19 git-mode cases are
        listed as not run;
        (3) sigil#395 is fixed in sigil v0.12.2 (2026-11-21); signing in
        release.yml is not yet wired;
        (4) the gale 400-commit run is not yet wired.
    links:
      - {type: satisfies, target: SSC-002}

  - id: REQ-032
    type: requirement
    title: Every lockfile is committed, CI resolves with it locked, and the audit covers it
    status: draft
    release: v0.4.0
    description: >
      Every tracked Cargo.toml, nested workspaces included, resolves with
      `cargo metadata --locked` in CI, so a missing, gitignored or stale
      lockfile turns the Test job red. cargo audit runs over every tracked
      Cargo.lock and fails on a vulnerability. A tracked manifest of another
      ecosystem fails until it has its own gate. Planted controls in the
      same job (a stale lock, a gitignored nested lock, a nested lock with a
      RustSec vulnerability) must each be rejected, or the job fails.
    fields:
      priority: must
      category: constraint
      progress: >
        2026-11-20: scripts/lockfiles.sh (locked, audit, controls) runs in the
        Test job; cargo-audit v0.22.2 pinned. Informational advisories are
        printed, not failed: heapless 0.8.0 (RUSTSEC-2026-0574..0582, unsound)
        reaches sieve through faster-hex 0.10.1 from gix and needs heapless
        0.9.4 upstream.
    links:
      - {type: satisfies, target: SSC-002}

  - id: REQ-033
    type: requirement
    title: One classify call writes the outputs and records the JSON verdict
    status: implemented
    release: v0.4.0
    description: >
      `sieve classify --format github-output --record <file>` writes the
      sieve.classify.v1 verdict (unresolved and explain included) to <file>
      in the same call as the outputs, so an adopter can keep it as an
      artifact for `sieve observe` without a second classify step, which
      check-workflows gate (b) refuses. The record is written first; if it
      cannot be written, or names a runner command file (GITHUB_OUTPUT,
      GITHUB_ENV, GITHUB_PATH, GITHUB_STATE, GITHUB_STEP_SUMMARY), no output
      is written and classify exits 2, so every gated job runs. Gate (b)
      accepts the flag only with $RUNNER_TEMP/<name> or a relative path of
      [A-Za-z0-9_.-/] with no `..` segment. Asked for by gale (sieve#25).
    fields:
      priority: must
      category: functional
      review: author-verified only (tests/cli.rs, tests/workflows_gates.rs); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-034
    type: requirement
    title: check-graph fails a hand entry that matches no tracked file
    status: implemented
    release: v0.4.0
    description: >
      The graph-inputs control fails each `hand` entry (a prefix or a file)
      that claims no tracked file at HEAD, naming the class and the entry
      (hand-matches-nothing). Before, only an empty cargo_glob or a class
      claiming nothing failed, so a directory moved under churn left a dead
      prefix that passed, and its new location ran everything unnoticed
      (sieve#23).
    fields:
      priority: should
      category: functional
      review: author-verified only (tests/cli.rs; the rule mutant is killed); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-005}

