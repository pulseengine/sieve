    release: v0.2.0
    fields:
      priority: should
      category: non-functional
      review: "author-measured (release build timings on gale, kiln, spar and witness, 0.07 to 1.32 s; all-.md diff on kiln 13.47 s before, 1.26 s after); no independent review yet"
    links:
      - {type: constraint-satisfies, target: SC-006}

  - id: REQ-019
    type: requirement
    title: Count observed misses by comparing sieve's verdict with a full run
    status: verified
