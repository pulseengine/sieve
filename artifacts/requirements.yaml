# Top-level requirements for sieve. Draft until reviewed by the owner.
# Sources: the gale handover package (design summary, corpus spec), the
# CLI/JSON interface drafted with plant, and the STPA seed in artifacts/stpa*.
artifacts:
  - id: REQ-001
    type: requirement
    title: Select every class whose input set intersects the change set
    status: verified
    description: >
      Additions, modifications and deletions all count; a rename counts as a
      delete of the old path plus an add of the new one.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-001}

  - id: REQ-002
    type: requirement
    title: Fail open on non-pull_request events and degenerate diffs
    status: verified
    description: >
      push, merge_group, schedule, workflow_dispatch and any other event that
      is not pull_request; a missing base sha; a failed diff; an empty diff:
      each yields run_all true with a reason naming the cause.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-002}

  - id: REQ-003
    type: requirement
    title: Turn every internal failure into run_all with an "internal:" reason
    status: verified
    description: >
      A panic, an unparseable manifest, a failed cargo metadata call or a
      timeout yields run_all true, a reason starting with "internal:" and a
      GitHub `::warning::` line, exit code 0. Usage errors and an invalid
      config exit 2 so the classifier job goes red, which the consumer if:
      form also treats as run. No exit path selects nothing.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-002}

  - id: REQ-004
    type: requirement
    title: Set run_all for any path no class claims and no inert rule covers
    status: verified
    description: >
      Unknown and unclaimed paths (a new top-level directory, say) are listed
      in unknown_paths and set run_all. Inert rules are explicit and
      reviewed in the consumer's config.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-003}

  - id: REQ-005
    type: requirement
    title: Treat CI, toolchain, build-system and sieve config paths as run-all paths
    status: verified
    description: >
      .github/**, the consumer's tools/** config, .cargo/** at any level,
      Cargo.lock, rust-toolchain*, BUILD, *.bzl, MODULE.bazel*, .bazelrc,
      .bazelversion, varve.toml, sieve.toml and committed graph snapshots.
      A run-all reason names the path, never with the "internal:" prefix.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-003}
      - {type: satisfies, target: SSC-003}

  - id: REQ-006
    type: requirement
    title: Derive class inputs from the build graph
    status: verified
    description: >
      cargo metadata --no-deps --offline per tracked manifest (nested
      workspace roots included); transitive path dependencies of every kind;
      every target's sources; scans for #[path], cfg_attr path,
      include!/include_str!/include_bytes!/include_dir!, wit_bindgen
      generate! paths (nested braces), build.rs path literals and .join("..")
      chains, concat!(env!("CARGO_MANIFEST_DIR"), ...), and
      [package.metadata.component] paths; Bazel literal srcs or a committed
      query snapshot with a fingerprint; the Zephyr module and the paths its
      CMake reads. Hand-listed entries are marked as hand.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-001}
      - {type: constraint-satisfies, target: SC-006}

  - id: REQ-007
    type: requirement
    title: Mark a class unresolved, and always run it, when an input cannot be resolved
    status: verified
    description: >
      An unresolvable include, .incbin, an unparsable generate! path, a Bazel
      glob, variable or @external label, or a snapshot whose fingerprint no
      longer matches the BUILD/.bzl/MODULE files.
    release: v0.1.0
    fields:
      priority: must
      category: functional
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-003}

  - id: REQ-008
    type: requirement
    title: Provide the classify CLI and the sieve.classify.v1 JSON contract
    status: verified
    description: >
      `sieve classify --config sieve.toml (--base S --head S | --paths-file F
      | --paths P...) [--event E] --format json|github-output`, honouring
      GATE_PROBE_FILES. JSON: schema, run_all, reason, classes, unknown_paths,
      inputs_hash. github-output writes one line per class plus run_all.
    release: v0.1.0
    fields:
      priority: must
      category: interface
      review: author-verified only (tests in CI); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-002}

  - id: REQ-009
    type: requirement
    title: Provide `sieve graph` (sieve.graph.v1) and `sieve check-graph`
    status: verified
    description: >
      graph prints each class's files with the source of each edge
      (cargo, path-attr, include, wit, build-rs, bazel, zephyr, hand), the
      run-all paths and the inert paths. check-graph runs the graph controls
      and exits 0 pass, 1 control failed, 2 usage, 3 refused.
    release: v0.1.0
    fields:
      priority: must
      category: interface
      review: author-verified only (tests in CI); no independent review yet
    links:
      - {type: constraint-satisfies, target: SC-001}
      - {type: constraint-satisfies, target: SC-003}

  - id: REQ-010
    type: requirement
    title: Classify from a paths file and build the graph without a .git directory
    status: verified
    description: >
      plant request. With --paths-file, and for graph, sieve makes no git
