      --offline --no-deps.
    release: v0.1.0
    fields:
      priority: must
      category: interface
      review: 'cold review 2026-11-18 by a fresh-context reviewer (subagent, not the author): 3 false-skip classes reproduced with the built binary, fixed in 32a87f1 with regression tests (tests/review_cases.rs); no re-review after the fix yet'
    links:
      - {type: constraint-satisfies, target: SC-005}

  - id: REQ-011
    type: requirement
    title: Print the output schema versions in `sieve --version`
    status: verified
    description: >
      plant request. --version names the crate version and every JSON schema
