# sieve's toolchain pin. `varve install` lays it down; the shims on PATH then
# run exactly these tools (rivet among them). `varve which rivet` names the layer.
# The realm comes from varve-realms.toml beside this file. Change layers only by
# editing this file in a reviewed commit.
manifest-version = 1

[toolchain]
realm   = "pulseengine"
channel = "rolling"
layer   = "2026.11.43"
