version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21). Every entry runs monthly (the 1st, 02:00 UTC), keeps
# at most 2 PRs open, and waits 7 days after a release (cooldown). Lockstep
# groups come first because Dependabot puts a dependency in the FIRST group it
# matches; then one minor-patch group. Majors stay ungrouped, one PR each, so
# a breaking change is read on its own. Security updates ignore the schedule
# and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # gix and its gix-* crates are released together and must move together.
      gix:
        patterns:
          - "gix"
          - "gix-*"
      minor-patch:
        update-types:
          - minor
          - patch
