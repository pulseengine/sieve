name: Release

# Builds, checks, signs and publishes a release for a v* tag. Modelled on
# pulseengine/synth's release.yml (Phase 6 onward): binary archives, a
# CycloneDX SBOM and a docs archive, all inside SHA256SUMS.txt, which cosign
# signs keyless; SLSA provenance for the archives; build-env.txt.
#
# Runners: GitHub-hosted on purpose, unlike ci.yml. The trigger is a tag push
# or a manual dispatch (never a pull request), the builds that get signed
# provenance run on fresh ephemeral machines, macOS has no self-hosted pool,
# and the self-hosted runners have no gh for the upload. tests/workflows.rs
# holds this file to hosted images and to no pull_request trigger.
#
# Hosted images are pinned (ubuntu-24.04, not ubuntu-latest, which moves to
# 26.04): moving to a new image is a deliberate PR, run advisory first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The wasmtime the component smoke test runs under; same pin and sha256 as
  # ci.yml (wasmtime-v50.0.3-x86_64-linux.tar.xz).
  WASMTIME_VERSION: v50.0.3
  WASMTIME_SHA256: c59133a9334e96eaca5e26f0d4c35199bfe43ab34049aa254ef4b47af1361476

defaults:
  run:
    shell: bash

jobs:
  # The tag must name Cargo.toml's version before anything compiles
  # (varve#38: a binary that reports the previous version).
  version-guard:
    name: Tag names the crate version
    # Tag pushes only: the signing identity is always refs/tags/v*, the only
    # identity the varve layer accepts (it refuses branch-signed sums). To
    # re-run, delete the release and re-push the tag.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Compare the tag with Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          scripts/release-check.sh version-guard "$VERSION"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [version-guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds: no loader and no glibc floor.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build sieve
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="sieve-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/sieve" staging/
          strip staging/sieve
          cp README.md LICENSE staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The archive a user downloads, not the loose build output: it must be
      # the tag's version and give both verdicts on a fixture.
      - name: Smoke-test the packaged binary
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf "$ARCHIVE" -C smoke
          scripts/release-check.sh smoke smoke/sieve "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # The WASI p2 component, the same build as the CI Test job, smoke-tested
  # under the pinned wasmtime. It ships raw (not meld-fused) and inside the
  # signed sums; the component itself is unsigned until sigil#396.
  build-component:
    name: Build wasm32-wasip2 component
    needs: [version-guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2

      - name: Build the component
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Fetch pinned wasmtime
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/wasmtime"; mkdir -p "$d"; cd "$d"
          asset="wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          curl -fsSL -o "$asset" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/$asset"
          act=$(sha256sum "$asset" | awk '{print $1}')
          test "$act" = "$WASMTIME_SHA256" || { echo "checksum mismatch for $asset: $act"; exit 1; }
          tar xJf "$asset"
          echo "WASMTIME=$d/wasmtime-$WASMTIME_VERSION-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      - name: Name and smoke-test the component
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          WASM="sieve-${VERSION}-wasm32-wasip2.wasm"
          cp target/wasm32-wasip2/release/sieve.wasm "$WASM"
          scripts/release-check.sh smoke-wasm "$WASM" "$VERSION"
          echo "WASM=$WASM" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: component
          path: ${{ env.WASM }}
          retention-days: 7

  # The SBOM tool runs here, with a read-only token, not in the job that
  # can sign and publish.
  sbom:
    name: SBOM (CycloneDX)
    needs: [version-guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.10

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5
          src=$(find . -maxdepth 1 -name '*.cdx.json' | head -1)
          test -n "$src" && test -s "$src"
          mkdir -p sbom && cp "$src" sbom/sieve.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom/sieve.cdx.json
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-component, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BARE=${VERSION#v}" >> "$GITHUB_ENV"
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          n=$(ls release-assets/*.tar.gz | wc -l)
          test "$n" -eq 3 || { echo "expected 3 archives, found $n"; exit 1; }
          find artifacts -type f -name "*.wasm" -exec cp {} release-assets/ \;
          n=$(ls release-assets/*.wasm | wc -l)
          test "$n" -eq 1 || { echo "expected 1 component, found $n"; exit 1; }
          ls -la release-assets/

      # The SBOM goes in before the sums, so its digest is signed too.
      - name: Add the SBOM
        run: cp artifacts/sbom/sieve.cdx.json "release-assets/sieve-${BARE}.cdx.json"

      # Docs archive before the sums, so a varve layer can ingest it through
      # the signed digest: README, the plan, the corpus schema, and the
      # released x86_64 binary's own --help and --version.
      - name: Build the docs archive
        run: |
          set -euo pipefail
          mkdir -p bin "docs-out/sieve-${BARE}-docs"
          tar -xzf "release-assets/sieve-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -C bin
          out="docs-out/sieve-${BARE}-docs"
          cp README.md "$out/"
          cp docs/plan.md "$out/"
          cp tests/corpus/README.md "$out/corpus.md"
          { echo '```'; bin/sieve --version; echo; bin/sieve --help; echo '```'; } > "$out/cli.md"
          tar -czf "release-assets/sieve-${BARE}-docs.tar.gz" -C docs-out .
          tar -tzf "release-assets/sieve-${BARE}-docs.tar.gz"

      # Inside the sums, so it is signed. The archives were built in the
      # build-binaries jobs with the same pinned toolchain action.
      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: v2.4.1 (sigstore/cosign-installer, pinned below)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      # North Star O5 input (pulseengine.eu#393, input.schema.json v1), inside
      # the sums so it is signed. One fact, the sieve classify gate. It does
      # not pass: the component is unsigned (sigil#395) and kiln does not run
      # it (kiln#687). wasmtime_equal and equivalence_in_ci come from the
      # required Test job on this commit (55 paths-mode corpus cases byte for
      # byte under wasmtime), which main's protection makes a precondition.
      - name: North Star O5 input
        run: |
          set -euo pipefail
          jq -n --arg v "$VERSION" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ev "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" '{
            schema_version: 1, objective: "O5", repo: "pulseengine/sieve",
            version: $v, generated_at: $now,
            generator: {tool: "sieve release.yml", version: $v},
            facts: [{id: "sieve-classify", ran: true, pass: false,
              detail: {signed: false, kiln_runs: false, wasmtime_equal: true,
                       equivalence_in_ci: true, gap_switch: false},
              evidence: $ev}],
            not_measured: [
              "the component is not signed (sigil#395)",
              "kiln does not run the component (kiln#687, 3 filesystem imports)",
              "wasmtime equality covers the 55 paths-mode corpus cases; git mode fails open under WASI (gix uses mmap)",
              "no equivalence run of the component over an adopter history"
            ]}' > release-assets/north-star-input.O5.json
          cat release-assets/north-star-input.O5.json

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.wasm

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      # Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/pulseengine/sieve/.github/workflows/release.yml@refs/tags/v.*$' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Work in progress; no production-ready claims.

          No Intel macOS (x86_64-apple-darwin) build from v0.3.0 on: the
          fleet stopped Intel macOS builds (owner, 2026-11-20). Apple silicon,
          Linux x86_64 and Linux aarch64 archives are published.

          sieve-${VERSION}-wasm32-wasip2.wasm is the WASI p2 component: paths
          mode only (git mode fails open under WASI), unsigned as a component
          until sigil#396, its digest in the signed SHA256SUMS.txt. Run it with
          the tree preopened as . and exit codes kept:

              wasmtime run -S cli-exit-with-code=y --dir .::. \\
                sieve-${VERSION}-wasm32-wasip2.wasm classify --config sieve.toml --paths <p>...

          Falsification: this release is wrong if a change to a file that a
          configured class's build or tests read yields \`false\` for that class
          (a false skip), if any failure (a crash, an unparseable manifest, an
          event other than pull_request, a missing base, a failed or empty
          diff) yields run_all false, or if a consumer observes a job failing
          on main that sieve classified as skippable on the pull request that
          introduced the failure. Evidence for each release is listed in
          docs/plan.md; plant holds the independent false-skip controls, and
          \`sieve equivalence\` and \`sieve observe\` are the consumer-side gates.

          Verify this release:

              cosign verify-blob \\
                --certificate-identity-regexp '^https://github.com/pulseengine/sieve/.github/workflows/release.yml@refs/tags/v.*$' \\
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
                --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
              sha256sum -c --ignore-missing SHA256SUMS.txt
              gh attestation verify sieve-${VERSION}-<target>.tar.gz --repo pulseengine/sieve
              gh attestation verify sieve-${VERSION}-wasm32-wasip2.wasm --repo pulseengine/sieve
              grep -- '-docs.tar.gz\$' SHA256SUMS.txt
          EOF
          # Never overwrite published assets: to re-run, delete the release.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; delete it before re-running" >&2
            exit 1
          fi
          gh release create "$VERSION" --verify-tag --title "sieve $VERSION" \
            --notes-file "$notes" --prerelease release-assets/*
