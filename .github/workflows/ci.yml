name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# `shell: bash` runs with -eo pipefail, so a piped step reports its own exit.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  # The rivet release CI validates with; matches the varve.toml
  # layer (covalent 2026.11.29, which composes pulseengine 2026.11.46).
  RIVET_VERSION: v0.43.3
  # sha256 of rivet-v0.43.3-x86_64-unknown-linux-gnu.tar.gz, recorded on
  # 2026-11-26 from the release's SHA256SUMS.txt after `cosign verify-blob`
  # of that file against the rivet release workflow identity. Pinned here so a
  # replaced release asset fails the job instead of being trusted with its own sums.
  RIVET_SHA256: ff05c74846f6c3398a59c715c9226d7ef3ad9dbe426d68ba66243af494e1630e
  # wasmtime runs the WASI component in the Test job (REQ-031). It is not in
  # the pinned pulseengine layer. sha256 of wasmtime-v50.0.3-x86_64-linux.tar.xz,
  # recorded on 2026-11-20: GitHub's asset digest matched a local download.
  WASMTIME_VERSION: v50.0.3
  WASMTIME_SHA256: c59133a9334e96eaca5e26f0d4c35199bfe43ab34049aa254ef4b47af1361476
  # Built from crates.io with --locked (scripts/lockfiles.sh audit).
  CARGO_AUDIT_VERSION: 0.22.2
  # kiln and meld for the advisory kiln job. meld is the covalent layer's;
  # kiln is 0.9.1, the first release with the startup fix (kiln#737).
  # sha256 of the x86_64 linux archives (kiln gnu, meld musl), recorded on
  # 2026-11-28 (kiln) and 2026-11-27 (meld) from each release's
  # SHA256SUMS.txt after `cosign verify-blob`
  # against that repo's release.yml tag identity.
  KILN_VERSION: v0.9.1
  KILN_SHA256: 2be8b0c9f06287a658e7be6bd51434639e5d382e58f2f4ec20b701bcc5c87af5
  MELD_VERSION: v0.70.0
  MELD_SHA256: 9ff3e50d538a54fd129a8962733b766569218eb9dbb8b9be642b389b6063895c

jobs:
  test:
    name: Test
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # Includes the 74-case classifier corpus against the built binary.
      - name: test
        run: cargo test --locked --all-targets --no-fail-fast -- --nocapture
      # REQ-032: every tracked manifest resolves with --locked (nested
      # workspaces too, so a gitignored lock is missing here) and cargo audit
      # covers every tracked Cargo.lock. The planted controls prove both gates
      # still reject a stale lock, an untracked nested lock and a nested
      # vulnerable lock.
      - name: install pinned cargo-audit
        run: cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      - name: lockfiles locked
        run: scripts/lockfiles.sh locked
      - name: lockfiles audited
        run: scripts/lockfiles.sh audit
      - name: lockfile gate controls
        run: scripts/lockfiles.sh controls
      # REQ-031: the same corpus through the WASI component under wasmtime.
      # Every paths-mode case must select its set AND print the native
      # binary's JSON byte for byte; git-mode cases are listed as not run.
      - name: fetch pinned wasmtime
        run: |
          d="$RUNNER_TEMP/wasmtime"; mkdir -p "$d"; cd "$d"
          asset="wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          curl -fsSL -o "$asset" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/$asset"
          act=$(sha256sum "$asset" | awk '{print $1}')
          test "$act" = "$WASMTIME_SHA256" || { echo "checksum mismatch for $asset: $act"; exit 1; }
          tar xJf "$asset"
          echo "SIEVE_WASMTIME=$d/wasmtime-$WASMTIME_VERSION-x86_64-linux/wasmtime" >> "$GITHUB_ENV"
      - name: build the WASI component
        run: |
          CARGO_TARGET_DIR=target/wasi cargo build --locked --release --target wasm32-wasip2
          echo "SIEVE_WASM=$PWD/target/wasi/wasm32-wasip2/release/sieve.wasm" >> "$GITHUB_ENV"
      - name: corpus under the component (byte-identical to native)
        run: |
          test -x "$SIEVE_WASMTIME" && test -s "$SIEVE_WASM"
          "$SIEVE_WASMTIME" --version
          cargo test --locked --test corpus -- --nocapture | tee "$RUNNER_TEMP/component.log"
          # proves the component ran: native mode prints no skipped git cases
          grep -q '^55/55 corpus case(s) pass (19 git-mode case(s) not run)$' "$RUNNER_TEMP/component.log"
      # The release smoke gate on the component the release ships: version,
      # CLI baseline (usage errors exit 2, through exit-with-code) and the
      # two-class fixture both ways, under the pinned wasmtime.
      - name: component release smoke
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          WASMTIME="$SIEVE_WASMTIME" scripts/release-check.sh smoke-wasm "$SIEVE_WASM" "v$v"

  # Advisory (not a required check): the corpus through the meld-fused
  # component under kiln, byte for byte against native, plus a planted
  # control that must differ. kiln 0.9.1 carries the startup fix (kiln#737);
  # 0.9.0 never finished a call on the linux runner (kiln#748).
  # kiln-regression against kiln HEAD is kiln's own job (SR-129).
  kiln:
    name: kiln (advisory)
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2
      - name: fetch pinned kiln and meld
        run: |
          d="$RUNNER_TEMP/tools"; mkdir -p "$d"; cd "$d"
          for t in "kiln $KILN_VERSION $KILN_SHA256 gnu" "meld $MELD_VERSION $MELD_SHA256 musl"; do
            set -- $t
            asset="$1-$2-x86_64-unknown-linux-$4.tar.gz"
            curl -fsSL -o "$asset" "https://github.com/pulseengine/$1/releases/download/$2/$asset"
            act=$(sha256sum "$asset" | awk '{print $1}')
            test "$act" = "$3" || { echo "checksum mismatch for $asset: $act"; exit 1; }
            mkdir -p "$1" && tar xzf "$asset" -C "$1"
          done
          echo "KILN=$(find "$d/kiln" -name kiln -type f | head -1)" >> "$GITHUB_ENV"
          echo "MELD=$(find "$d/meld" -name meld -type f | head -1)" >> "$GITHUB_ENV"
      - name: build native and the component, fuse it
        run: |
          cargo build --locked
          CARGO_TARGET_DIR=target/wasi cargo build --locked --release --target wasm32-wasip2
          "$KILN" --version; "$MELD" --version
          f="$RUNNER_TEMP/fused"; mkdir -p "$f"
          "$MELD" fuse --memory multi --reproducible target/wasi/wasm32-wasip2/release/sieve.wasm \
            -o "$f/sieve.fused.wasm" --emit-import-map "$f/map.json"
          sha256sum "$f/sieve.fused.wasm"
          { echo "FUSED=$f/sieve.fused.wasm"; echo "IMPORT_MAP=$f/map.json"; } >> "$GITHUB_ENV"
      - name: planted control (the diff must be able to fail)
        timeout-minutes: 10
        run: scripts/kiln-control.sh target/debug/sieve
      - name: corpus under kiln (byte-identical to native)
        env:
          SIEVE_WASMTIME: ${{ github.workspace }}/scripts/kiln-as-wasmtime.sh
        run: |
          start=$(date +%s)
          SIEVE_WASM="$FUSED" cargo test --locked --test corpus -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/kiln.log"
          grep -q '^55/55 corpus case(s) pass (19 git-mode case(s) not run)$' "$RUNNER_TEMP/kiln.log"
          s=$(($(date +%s) - start))
          echo "kiln $KILN_VERSION: 55/55 paths-mode corpus cases byte-identical to native, ${s} s wall" >> "$GITHUB_STEP_SUMMARY"

  rivet:
    name: rivet validate
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch pinned rivet release
        run: |
          d="$RUNNER_TEMP/rivet"; mkdir -p "$d"; cd "$d"
          asset="rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/pulseengine/rivet/releases/download/$RIVET_VERSION"
          curl -fsSL -o "$asset" "$base/$asset"
          act=$(sha256sum "$asset" | awk '{print $1}')
          test "$act" = "$RIVET_SHA256" || { echo "checksum mismatch for $asset: $act"; exit 1; }
          tar xzf "$asset"
          echo "$d/$(dirname "$(find . -name rivet -type f | head -1)")" >> "$GITHUB_PATH"
      - name: rivet validate
        run: |
          rivet --version
          rivet validate
      - name: test markers
        run: rivet coverage --tests
