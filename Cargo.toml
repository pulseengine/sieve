[package]
name = "sieve"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Shared CI path classifier: which heavy CI jobs a change touches; unsure means everything runs"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/sieve"
publish = false

[dependencies]
aho-corasick = "1"
regex = "1"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
