[package]
name = "sieve"
version = "0.4.6"
edition = "2021"
rust-version = "1.80"
description = "Shared CI path classifier: which heavy CI jobs a change touches; unsure means everything runs"
license = "Apache-2.0"
repository = "https://github.com/pulseengine/sieve"
publish = false

[dependencies]
aho-corasick = "1"
gix = { version = "0.90", default-features = false, features = ["sha1", "index", "revision", "blob-diff"] }
regex = "1"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
# rivet's own YAML (owner: a git dependency until upstream rowan is sound)
rivet-yaml = { git = "https://github.com/pulseengine/rivet", rev = "5072986f55c3457b27c7f8a4afd79a952fb0ab58" } # tag v0.43.0

[profile.release]
lto = true
codegen-units = 1
